<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam - Apple Weather Live Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(28, 34, 48, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .sidebar-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(30, 58, 138, 0.4));
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0b0e17] text-white font-sans min-h-screen flex justify-center items-center p-0 lg:p-6 overflow-hidden">

    <div class="w-full max-w-[1280px] h-screen lg:h-[820px] lg:rounded-3xl bg-[#0f131f] shadow-2xl flex overflow-hidden border border-slate-800/80">
        
        <!-- Sidebar: City List -->
        <div class="w-80 bg-[#131722] border-r border-slate-800/80 flex flex-col hidden md:flex">
            <div class="p-4 border-b border-slate-800/60">
                <div class="flex items-center space-x-2 bg-[#1b2030] px-3.5 py-2 rounded-xl border border-slate-700/50 text-slate-400 text-xs">
                    <span>🔍</span>
                    <input type="text" id="citySearchInput" placeholder="Enter city & press Enter..." onkeypress="handleSearch(event)" class="bg-transparent focus:outline-none w-full text-white placeholder-slate-500 text-xs">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="cityListContainer">
                <!-- Predefined Cities -->
                <div onclick="selectCity('New Delhi', 28.6139, 77.2090)" class="sidebar-item active p-3.5 rounded-2xl cursor-pointer">
                    <div class="flex justify-between items-start">
                        <div><div class="text-sm font-bold text-white">New Delhi</div><div class="text-[10px] text-blue-300 mt-0.5">Primary Station</div></div>
                        <div id="sidebar-New-Delhi" class="text-2xl font-bold">--°</div>
                    </div>
                </div>
                <div onclick="selectCity('Mumbai', 19.0760, 72.8777)" class="sidebar-item p-3.5 rounded-2xl cursor-pointer">
                    <div class="flex justify-between items-start">
                        <div><div class="text-xs text-slate-400">Mumbai</div><div class="text-[10px] text-slate-500 mt-0.5">Coastal Zone</div></div>
                        <div id="sidebar-Mumbai" class="text-xl font-semibold">--°</div>
                    </div>
                </div>
                <div onclick="selectCity('Bengaluru', 12.9716, 77.5946)" class="sidebar-item p-3.5 rounded-2xl cursor-pointer">
                    <div class="flex justify-between items-start">
                        <div><div class="text-xs text-slate-400">Bengaluru</div><div class="text-[10px] text-slate-500 mt-0.5">Southern Hub</div></div>
                        <div id="sidebar-Bengaluru" class="text-xl font-semibold">--°</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard View -->
        <div class="flex-1 flex flex-col overflow-y-auto bg-gradient-to-b from-[#161b2c] to-[#0f131f]">
            
            <!-- Top Header & Persona Navigation -->
            <div class="px-8 py-4 border-b border-slate-800/60 flex flex-col sm:flex-row justify-between items-center bg-[#131722]/50 backdrop-blur-md sticky top-0 z-20">
                <div>
                    <h1 class="text-xl font-bold tracking-tight" id="activeCityTitle">New Delhi</h1>
                    <p class="text-xs text-slate-400" id="activeCitySub">Live IMD & Open-Meteo Synced Feed</p>
                </div>
                <div class="flex items-center space-x-3 mt-2 sm:mt-0">
                    <span class="text-xs text-slate-400 font-medium">Domain Page:</span>
                    <select id="personaSelect" onchange="navigateToPersona()" class="bg-[#1c2230] border border-slate-700 text-xs font-semibold px-3 py-1.5 rounded-xl text-blue-400 focus:outline-none cursor-pointer">
                        <option value="dashboard" selected>⚡ General Live Weather</option>
                        <option value="agriculture">🌱 Agriculture & AI Q&A Hub</option>
                        <option value="commuter">🚗 Commuter & Transit Intelligence</option>
                    </select>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div class="p-8 space-y-6">
                
                <!-- Hero Weather Header -->
                <div class="text-center py-4">
                    <div class="text-6xl font-extralight tracking-tighter mb-1" id="liveTemp">--°C</div>
                    <div class="text-lg font-medium text-slate-200" id="liveCondition">Loading live telemetry...</div>
                    <div class="text-xs text-slate-400 mt-1" id="liveHighLow">Wind & Atmospheric Data Active</div>
                </div>

                <!-- Hourly Forecast Strip -->
                <div class="glass-card p-4 rounded-2xl">
                    <p class="text-xs text-slate-400 mb-3 font-medium" id="hourlySummary">Fetching atmospheric conditions...</p>
                    <div id="hourlyStrip" class="flex justify-between items-center overflow-x-auto space-x-6 pb-2 text-center text-xs">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>

                <!-- Bento Grid Metrics -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="glass-card p-5 rounded-2xl lg:col-span-1 flex flex-col">
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center space-x-2">
                            <span>📅</span><span>Live 7-Day Forecast</span>
                        </div>
                        <div id="forecastList" class="space-y-3.5 flex-1">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>

                    <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6" id="bentoWidgets">
                        <!-- Dynamic Metric Cards -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Default coordinates for New Delhi
        let currentLat = 28.6139;
        let currentLon = 77.2090;
        let currentCityName = "New Delhi";

        async function fetchLiveWeather(lat, lon, cityName) {
            currentLat = lat;
            currentLon = lon;
            currentCityName = cityName;

            document.getElementById('activeCityTitle').innerText = cityName;
            document.getElementById('activeCitySub').innerText = "Fetching live telemetry...";

            try {
                // Free public weather API endpoint (Open-Meteo) requiring no API key
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto`);
                const data = await response.json();

                updateUI(data, cityName);
            } catch (error) {
                console.error("Error fetching live weather:", error);
                document.getElementById('activeCitySub').innerText = "Failed to load live feed. Check connection.";
            }
        }

        function getWeatherCondition(code) {
            // WMO Weather interpretation codes
            if (code === 0) return { text: "Clear Sky", icon: "☀️" };
            if (code >= 1 && code <= 3) return { text: "Partly Cloudy", icon: "⛅" };
            if (code >= 51 && code <= 67) return { text: "Drizzle & Rain", icon: "🌧️" };
            if (code >= 71 && code <= 77) return { text: "Snowfall", icon: "❄️" };
            if (code >= 95) return { text: "Thunderstorm", icon: "⚡" };
            return { text: "Overcast", icon: "☁️" };
        }

        function updateUI(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            const hourly = data.hourly;

            const condition = getWeatherCondition(current.weather_code);

            // Update Hero Header
            document.getElementById('liveTemp').innerText = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('liveCondition').innerText = condition.text;
            document.getElementById('activeCitySub').innerText = `Live Lat: ${currentLat.toFixed(2)}, Lon: ${currentLon.toFixed(2)}`;
            document.getElementById('liveHighLow').innerText = `H: ${Math.round(daily.temperature_2m_max[0])}° • L: ${Math.round(daily.temperature_2m_min[0])}°`;
            document.getElementById('hourlySummary').innerText = `Atmospheric pressure stable. Current wind speed is ${current.wind_speed_10m} km/h.`;

            // Update Hourly Strip
            const hourlyStrip = document.getElementById('hourlyStrip');
            hourlyStrip.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const hourTime = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const hrCond = getWeatherCondition(hourly.weather_code[i]);
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="text-slate-400 mb-2">${hourTime}</div>
                    <div class="text-base">${hrCond.icon}</div>
                    <div class="text-[10px] text-blue-400 mb-1">${hourly.precipitation_probability[i]}%</div>
                    <div class="font-semibold">${Math.round(hourly.temperature_2m[i])}°</div>
                `;
                hourlyStrip.appendChild(div);
            }

            // Update 7-Day Forecast
            const forecastList = document.getElementById('forecastList');
            forecastList.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const dayLabel = i === 0 ? "Today" : new Date(daily.time[i]).toLocaleDateString('en', { weekday: 'short' });
                const dayCond = getWeatherCondition(daily.weather_code[i]);
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between text-xs';
                row.innerHTML = `
                    <span class="w-12 text-slate-400 font-medium">${dayLabel}</span>
                    <span class="text-sm">${dayCond.icon}</span>
                    <span class="text-slate-400">${Math.round(daily.temperature_2m_min[i])}°</span>
                    <div class="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden mx-2">
                        <div class="h-full bg-gradient-to-r from-blue-400 to-amber-400 rounded-full w-3/4"></div>
                    </div>
                    <span class="font-semibold">${Math.round(daily.temperature_2m_max[i])}°</span>
                `;
                forecastList.appendChild(row);
            }

            // Update Bento Widgets
            const bentoContainer = document.getElementById('bentoWidgets');
            bentoContainer.innerHTML = `
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">HUMIDITY LEVEL</div>
                        <div class="text-xl font-bold text-white mb-2">${current.relative_humidity_2m}%</div>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-800/80 pt-3 mt-2">Dew point is comfortable for outdoor activities.</div>
                </div>
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">FEELS LIKE TEMP</div>
                        <div class="text-xl font-bold text-white mb-2">${Math.round(current.apparent_temperature)}°C</div>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-800/80 pt-3 mt-2">Wind chill factor is minimal at current speeds.</div>
                </div>
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">WIND VELOCITY</div>
                        <div class="text-xl font-bold text-white mb-2">${current.wind_speed_10m} km/h</div>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-800/80 pt-3 mt-2">Favorable aerodynamic conditions across sectors.</div>
                </div>
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">PRECIPITATION</div>
                        <div class="text-xl font-bold text-white mb-2">${current.precipitation} mm</div>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-800/80 pt-3 mt-2">Live gauge reading from regional telemetry station.</div>
                </div>
            `;
        }

        function selectCity(name, lat, lon) {
            fetchLiveWeather(lat, lon, name);
        }

        async function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (!query) return;
                try {
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
                    const geoData = await geoRes.json();
                    if (geoData.results && geoData.results.length > 0) {
                        const loc = geoData.results[0];
                        fetchLiveWeather(loc.latitude, loc.longitude, loc.name);
                    } else {
                        alert("City not found. Try another location.");
                    }
                } catch (err) {
                    console.error("Geocoding error:", err);
                }
            }
        }

        function navigateToPersona() {
            const val = document.getElementById('personaSelect').value;
            if (val === 'agriculture') {
                window.location.href = 'agriculture.html';
            } else if (val === 'commuter') {
                window.location.href = 'commuter.html';
            }
        }

        // Initialize with New Delhi on load
        window.onload = () => {
            fetchLiveWeather(28.6139, 77.2090, "New Delhi");
        };
    </script>
</body>
</html>
