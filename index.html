<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam - Dynamic Sky & Persona Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body id="bodyTag" class="bg-slate-900 font-sans transition-colors duration-500 flex justify-center items-center min-h-screen">

    <div id="appContainer" class="max-w-md w-full min-h-screen sm:min-h-[800px] sm:rounded-3xl shadow-2xl flex flex-col transition-all duration-500 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 overflow-hidden border border-slate-700/20">
        
        <!-- Dynamic Sky & Weather Header -->
        <header id="appHeader" class="p-6 text-white bg-gradient-to-br from-sky-400 to-blue-600 transition-all duration-700 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide">Mausam (मौसम)</h1>
                    <p id="skyStatusText" class="text-xs text-white/90 font-medium">Live Sky: Clear Blue Day</p>
                </div>
                <!-- Dark Mode & Sky Theme Controls -->
                <div class="flex items-center space-x-2">
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-white/20 hover:bg-white/30 transition text-sm" title="Toggle Dark Mode">
                        🌙
                    </button>
                </div>
            </div>

            <!-- Weather Condition / Sky Color Selector -->
            <div class="mb-2">
                <label class="block text-[10px] uppercase tracking-wider font-bold text-white/80 mb-1">Simulate Sky & Weather Color:</label>
                <select id="skyThemeSelect" onchange="updateSkyTheme()" class="w-full p-2 rounded-lg bg-black/20 backdrop-blur-md border border-white/30 text-white text-xs font-semibold focus:outline-none">
                    <option value="clear" class="text-black">☀️ Clear Blue Day</option>
                    <option value="sunset" class="text-black">🌅 Golden Hour / Sunset</option>
                    <option value="rainy" class="text-black">🌧️ Rainy Grey-Blue</option>
                    <option value="stormy" class="text-black">⚡ Stormy Charcoal</option>
                    <option value="windy" class="text-black">💨 Windy Cyan</option>
                    <option value="night" class="text-black">🌙 Night Sky</option>
                </select>
            </div>
        </header>

        <!-- Persona Selection Bar -->
        <div class="p-4 bg-slate-50 dark:bg-slate-800/50 border-b dark:border-slate-800 transition-colors">
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase mb-1">Select Your User Persona:</label>
            <select id="personaSelect" onchange="updateDashboard()" class="w-full p-2.5 border dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="health">health-conscious (AQI, Pollen, UV)</option>
                <option value="fitness">Outdoor Fitness (Running hours, Wind)</option>
                <option value="beach">Beachgoers & Surfers (Tides, Waves)</option>
                <option value="agriculture">Agriculture & Gardeners (Soil, Frost)</option>
                <option value="commuter">Commuters (Traffic, Visibility)</option>
            </select>
        </div>

        <!-- Dynamic Widget Container -->
        <div id="widgetContainer" class="p-4 flex-1 space-y-4 overflow-y-auto bg-slate-100/50 dark:bg-slate-900/50">
            <!-- Widgets injected via JS -->
        </div>
    </div>

    <script>
        const personaData = {
            health: [
                { title: "Air Quality Index (AQI)", value: "142 (Unhealthy)", desc: "High particulate matter. Wear a mask outdoors." },
                { title: "Pollen Count", value: "Moderate", desc: "Tree pollen levels are elevated today." },
                { title: "UV Index", value: "6.5 (High)", desc: "Sun protection required between 11 AM - 3 PM." }
            ],
            fitness: [
                { title: "Best Running Hours", value: "05:30 AM - 07:00 AM", desc: "Optimal temperature and low pollution window." },
                { title: "Wind Speed", value: "12 km/h (W)", desc: "Mild breeze, favorable for outdoor cycling." },
                { title: "Heat Alert", value: "Normal", desc: "No extreme heat warnings for your route." }
            ],
            beach: [
                { title: "Sea Conditions", value: "Moderate Swells", desc: "Water temp: 27°C. Safe for experienced swimmers." },
                { title: "Tide Timings", value: "High Tide: 02:15 PM", desc: "Low Tide expected at 08:30 PM." },
                { title: "Wave Height", value: "1.8 Meters", desc: "Good surfing conditions near the shore." }
            ],
            agriculture: [
                { title: "Soil Moisture", value: "34% (Optimal)", desc: "Adequate moisture levels for root growth." },
                { title: "Rainfall Prediction", value: "4mm expected", desc: "Light showers likely by late evening." },
                { title: "Frost Alert", value: "None", desc: "No risk of overnight temperature drop." }
            ],
            commuter: [
                { title: "Traffic & Weather Sync", value: "Moderate Delays", desc: "Light fog reducing visibility on highway stretch." },
                { title: "Visibility", value: "2.5 km", desc: "Drive with low-beam headlights on." },
                { title: "Precipitation Alert", value: "Clear for Commute", desc: "No rain expected during typical office hours." }
            ]
        };

        const skyThemes = {
            clear: {
                headerClass: "from-sky-400 via-blue-500 to-blue-600",
                status: "Live Sky: Clear Blue Day ☀️"
            },
            sunset: {
                headerClass: "from-amber-500 via-orange-500 to-rose-600",
                status: "Live Sky: Golden Hour / Sunset 🌅"
            },
            rainy: {
                headerClass: "from-slate-600 via-blue-700 to-slate-800",
                status: "Live Sky: Rainy & Overcast 🌧️"
            },
            stormy: {
                headerClass: "from-gray-800 via-zinc-900 to-black",
                status: "Live Sky: Stormy & Dark ⚡"
            },
            windy: {
                headerClass: "from-teal-500 via-cyan-600 to-blue-700",
                status: "Live Sky: Windy Breeze 💨"
            },
            night: {
                headerClass: "from-slate-900 via-indigo-950 to-black",
                status: "Live Sky: Clear Night Sky 🌙"
            }
        };

        function updateSkyTheme() {
            const selectedTheme = document.getElementById('skyThemeSelect').value;
            const header = document.getElementById('appHeader');
            const statusText = document.getElementById('skyStatusText');
            
            const themeConfig = skyThemes[selectedTheme];
            
            // Reset and apply new gradient classes
            header.className = `p-6 text-white bg-gradient-to-br ${themeConfig.headerClass} transition-all duration-700 shadow-md`;
            statusText.innerText = themeConfig.status;
        }

        function toggleDarkMode() {
            const htmlBody = document.documentElement;
            htmlBody.classList.toggle('dark');
        }

        function updateDashboard() {
            const selectedPersona = document.getElementById('personaSelect').value;
            const container = document.getElementById('widgetContainer');
            const widgets = personaData[selectedPersona];

            container.innerHTML = '';

            widgets.forEach(widget => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 shadow-sm transition-all duration-300`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="font-bold text-sm text-slate-800 dark:text-slate-100">${widget.title}</h2>
                        <span class="text-[10px] px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 font-bold">Active</span>
                    </div>
                    <p class="text-lg font-extrabold mb-1 text-slate-900 dark:text-white">${widget.value}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">${widget.desc}</p>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            updateDashboard();
            updateSkyTheme();
        };
    </script>
</body>
</html>
