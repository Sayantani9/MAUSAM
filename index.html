<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam - iOS Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Apple-style translucent frosted glass cards */
        .apple-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Hide scrollbars for clean iOS aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body id="bodyBg" class="bg-blue-600 text-white font-sans min-h-screen flex justify-center items-center p-0 sm:p-6 transition-colors duration-1000">

    <!-- Mobile Frame Container simulating iPhone -->
    <div id="appContainer" class="w-full max-w-md min-h-screen sm:min-h-[850px] sm:rounded-[48px] shadow-2xl flex flex-col transition-all duration-1000 bg-gradient-to-b from-blue-400 via-blue-500 to-blue-700 overflow-hidden relative border-[8px] border-slate-900/10">
        
        <!-- iOS Status Bar Simulation -->
        <div class="px-7 pt-4 pb-2 flex justify-between items-center text-xs font-semibold text-white/90 tracking-wide select-none">
            <span>9:41</span>
            <div class="flex items-center space-x-2 text-[11px]">
                <span>5G</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- Atmospheric Sky & Weather Simulator Bar -->
        <div class="px-6 py-2 bg-black/20 backdrop-blur-md mx-6 rounded-2xl flex justify-between items-center border border-white/10 mb-4 shadow-sm">
            <span id="skyStatusText" class="text-xs font-medium tracking-tight">☀️ Clear Day Sky</span>
            <select id="skyThemeSelect" onchange="updateSkyTheme()" class="bg-transparent text-xs font-semibold text-white focus:outline-none cursor-pointer">
                <option value="clear" class="text-slate-900">☀️ Clear Sky</option>
                <option value="sunset" class="text-slate-900">🌅 Sunset</option>
                <option value="rainy" class="text-slate-900">🌧️ Rainy</option>
                <option value="stormy" class="text-slate-900">⚡ Stormy</option>
                <option value="windy" class="text-slate-900">💨 Windy</option>
                <option value="night" class="text-slate-900">🌙 Night</option>
            </select>
        </div>

        <!-- Main Hero Weather Header (Apple Weather Style) -->
        <header class="px-6 pt-2 pb-6 text-center select-none">
            <h1 class="text-3xl font-medium tracking-tight">New Delhi</h1>
            <p class="text-7xl font-light tracking-tighter my-1">28°</p>
            <p class="text-lg font-medium text-white/90">Sunny</p>
            <div class="flex justify-center space-x-3 text-sm font-medium text-white/80 mt-1">
                <span>H: 32°</span>
                <span>L: 21°</span>
            </div>
        </header>

        <!-- Persona Selection Pill Bar -->
        <div class="px-6 mb-4">
            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none" id="personaPills">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Main Content Area / Apple Weather Modules -->
        <div id="widgetContainer" class="px-6 flex-1 space-y-4 overflow-y-auto pb-10">
            <!-- Dynamic Widgets Injected Here -->
        </div>

        <!-- iOS Home Indicator Bar -->
        <div class="py-3 flex justify-center bg-transparent">
            <div class="w-32 h-1 bg-white/40 rounded-full"></div>
        </div>
    </div>

    <script>
        const personaData = {
            health: [
                { title: "AIR QUALITY INDEX", subtitle: "142 • Unhealthy", desc: "High particulate matter detected. Consider wearing a mask outdoors." },
                { title: "POLLEN COUNT", subtitle: "Moderate", desc: "Tree pollen levels are elevated today in your sector." },
                { title: "UV INDEX", subtitle: "6.5 • High", desc: "Sun protection required. Peak intensity between 11 AM - 3 PM." }
            ],
            fitness: [
                { title: "BEST RUNNING HOURS", subtitle: "05:30 AM - 07:00 AM", desc: "Optimal temperature window with lowest pollution levels." },
                { title: "WIND SPEED", subtitle: "12 km/h W", desc: "Mild breeze, highly favorable conditions for outdoor cycling." },
                { title: "HEAT STRESS", subtitle: "Normal", desc: "No extreme thermal alerts active along your usual route." }
            ],
            beach: [
                { title: "SEA CONDITIONS", subtitle: "Moderate Swells", desc: "Water temp: 27°C. Safe conditions for experienced swimmers." },
                { title: "TIDE TIMINGS", subtitle: "High Tide: 02:15 PM", desc: "Low tide expected later tonight at 08:30 PM." },
                { title: "WAVE HEIGHT", subtitle: "1.8 Meters", desc: "Good surf conditions near the north shore break." }
            ],
            agriculture: [
                { title: "SOIL MOISTURE", subtitle: "34% • Optimal", desc: "Adequate moisture levels registered for healthy root growth." },
                { title: "RAINFALL PREDICTION", subtitle: "4mm Expected", desc: "Light localized showers likely by late evening hours." },
                { title: "FROST ALERT", subtitle: "None", desc: "Zero risk of sudden overnight temperature drops." }
            ],
            commuter: [
                { title: "TRAFFIC & WEATHER", subtitle: "Moderate Delays", desc: "Light fog reducing visibility along the main highway corridor." },
                { title: "VISIBILITY RANGE", subtitle: "2.5 km", desc: "Recommended to use low-beam headlights during transit." },
                { title: "PRECIPITATION WINDOW", subtitle: "Clear for Commute", desc: "No rain expected during standard office departure hours." }
            ]
        };

        const skyThemes = {
            clear: {
                gradient: "from-blue-400 via-blue-500 to-blue-700",
                status: "☀️ Clear Day Sky"
            },
            sunset: {
                gradient: "from-amber-500 via-rose-500 to-indigo-900",
                status: "🌅 Golden Sunset"
            },
            rainy: {
                gradient: "from-slate-600 via-blue-800 to-slate-900",
                status: "🌧️ Rainy & Overcast"
            },
            stormy: {
                gradient: "from-zinc-800 via-slate-900 to-black",
                status: "⚡ Stormy Conditions"
            },
            windy: {
                gradient: "from-teal-600 via-cyan-700 to-blue-900",
                status: "💨 Windy Atmosphere"
            },
            night: {
                gradient: "from-slate-950 via-indigo-950 to-black",
                status: "🌙 Night Sky"
            }
        };

        let currentPersona = 'health';

        function updateSkyTheme() {
            const themeKey = document.getElementById('skyThemeSelect').value;
            const container = document.getElementById('appContainer');
            const theme = skyThemes[themeKey];

            container.className = `w-full max-w-md min-h-screen sm:min-h-[850px] sm:rounded-[48px] shadow-2xl flex flex-col transition-all duration-1000 bg-gradient-to-b ${theme.gradient} overflow-hidden relative border-[8px] border-slate-900/10`;
            document.getElementById('skyStatusText').innerText = theme.status;
        }

        const personaLabels = [
            { id: 'health', name: '🩺 Health' },
            { id: 'fitness', name: '⚡ Fitness' },
            { id: 'beach', name: '🌊 Beach' },
            { id: 'agriculture', name: '🌱 Agri' },
            { id: 'commuter', name: '🚗 Commute' }
        ];

        function renderPills() {
            const pillsContainer = document.getElementById('personaPills');
            pillsContainer.innerHTML = '';
            personaLabels.forEach(p => {
                const isActive = currentPersona === p.id;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full text-xs font-medium tracking-tight whitespace-nowrap transition-all ${isActive ? 'bg-white text-slate-900 font-semibold shadow-md' : 'bg-white/20 text-white hover:bg-white/30'}`;
                btn.innerText = p.name;
                btn.onclick = () => {
                    currentPersona = p.id;
                    renderPills();
                    updateDashboard();
                };
                pillsContainer.appendChild(btn);
            });
        }

        function updateDashboard() {
            const container = document.getElementById('widgetContainer');
            const widgets = personaData[currentPersona];

            container.innerHTML = '';

            widgets.forEach(widget => {
                const card = document.createElement('div');
                card.className = `apple-card p-4 rounded-3xl shadow-lg transition-all duration-300`;
                card.innerHTML = `
                    <div class="text-[10px] font-bold tracking-widest text-white/70 uppercase mb-1">${widget.title}</div>
                    <div class="text-xl font-semibold tracking-tight text-white mb-1.5">${widget.subtitle}</div>
                    <div class="text-xs text-white/80 leading-relaxed font-normal border-t border-white/10 pt-2">${widget.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            renderPills();
            updateDashboard();
        };
    </script>
</body>
</html>
