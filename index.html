<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam - Next-Gen Persona Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glassdark: 'rgba(15, 23, 42, 0.75)',
                        glasslight: 'rgba(255, 255, 255, 0.85)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth glassmorphism backdrop blur */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body id="bodyTag" class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center items-center p-0 sm:p-6 transition-colors duration-700">

    <!-- App Frame (Mobile-first responsive card container) -->
    <div id="appContainer" class="w-full max-w-md min-h-screen sm:min-h-[850px] sm:rounded-3xl shadow-2xl flex flex-col transition-all duration-700 bg-slate-900/90 overflow-hidden relative border border-slate-800">
        
        <!-- Ambient Glow Background Element -->
        <div id="ambientGlow" class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-blue-500/20 blur-3xl pointer-events-none transition-all duration-700"></div>

        <!-- Dynamic Sky & Weather Header -->
        <header id="appHeader" class="p-6 text-white bg-gradient-to-br from-blue-600 via-indigo-600 to-sky-500 transition-all duration-700 relative z-10 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <h1 class="text-lg font-bold tracking-tight">Mausam <span class="text-xs uppercase px-1.5 py-0.5 rounded bg-black/20 font-mono">Live</span></h1>
                    </div>
                    <p id="skyStatusText" class="text-xs text-white/80 font-medium mt-0.5">Live Sky: Clear Blue Day</p>
                </div>
                <!-- Controls -->
                <div class="flex items-center space-x-2">
                    <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-black/20 hover:bg-black/30 backdrop-blur-md transition text-xs border border-white/10" title="Toggle Light/Dark Mode">
                        🌓
                    </button>
                </div>
            </div>

            <!-- Weather / Sky Color Simulator -->
            <div>
                <label class="block text-[10px] uppercase tracking-wider font-mono font-bold text-white/70 mb-1">Simulate Atmosphere / Sky Shade:</label>
                <select id="skyThemeSelect" onchange="updateSkyTheme()" class="w-full p-2.5 rounded-xl bg-black/30 backdrop-blur-xl border border-white/20 text-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-white/40 cursor-pointer">
                    <option value="clear" class="text-slate-900">☀️ Clear Blue Day</option>
                    <option value="sunset" class="text-slate-900">🌅 Golden Hour / Sunset</option>
                    <option value="rainy" class="text-slate-900">🌧️ Rainy Grey-Blue</option>
                    <option value="stormy" class="text-slate-900">⚡ Stormy Charcoal</option>
                    <option value="windy" class="text-slate-900">💨 Windy Cyan</option>
                    <option value="night" class="text-slate-900">🌙 Night Sky</option>
                </select>
            </div>
        </header>

        <!-- Persona Selection Bar -->
        <div class="p-4 bg-slate-900/60 backdrop-blur-md border-b border-slate-800 relative z-10">
            <label class="block text-[11px] font-mono font-bold text-slate-400 uppercase tracking-wider mb-1.5">Select User Persona Context:</label>
            <select id="personaSelect" onchange="updateDashboard()" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm font-medium text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-inner">
                <option value="health">🩺 Health-Conscious (AQI, Pollen, UV)</option>
                <option value="fitness">⚡ Outdoor Fitness (Running Hours, Wind)</option>
                <option value="beach">🌊 Beachgoers & Surfers (Tides, Waves)</option>
                <option value="agriculture">🌱 Agriculture & Gardeners (Soil, Frost)</option>
                <option value="commuter">🚗 Commuters (Traffic, Visibility)</option>
            </select>
        </div>

        <!-- Dynamic Widget Container -->
        <div id="widgetContainer" class="p-4 flex-1 space-y-3 overflow-y-auto relative z-10 bg-slate-950/40">
            <!-- Widgets injected dynamically via JS -->
        </div>

        <!-- Footer Branding -->
        <div class="py-3 text-center border-t border-slate-800/60 bg-slate-900/40 text-[10px] font-mono text-slate-500">
            Mausam AI Personalization Engine &bull; Hackathon Prototype
        </div>
    </div>

    <script>
        const personaData = {
            health: [
                { title: "Air Quality Index (AQI)", value: "142 (Unhealthy)", desc: "High particulate matter detected. Wear a mask outdoors.", tag: "AQI Alert" },
                { title: "Pollen Count", value: "Moderate", desc: "Tree pollen levels elevated. Take antihistamines if sensitive.", tag: "Allergy Feed" },
                { title: "UV Index", value: "6.5 (High)", desc: "Sun protection required between 11 AM - 3 PM.", tag: "Solar Guard" }
            ],
            fitness: [
                { title: "Best Running Hours", value: "05:30 AM - 07:00 AM", desc: "Optimal temperature and low pollution window.", tag: "Peak Time" },
                { title: "Wind Speed & Direction", value: "12 km/h (W)", desc: "Mild breeze, favorable conditions for cycling.", tag: "Aero Track" },
                { title: "Heat Stress Alert", value: "Normal", desc: "No extreme heat warnings issued for your running route.", tag: "Safety Status" }
            ],
            beach: [
                { title: "Sea Conditions", value: "Moderate Swells", desc: "Water temp: 27°C. Safe for experienced swimmers.", tag: "Marine Feed" },
                { title: "Tide Timings", value: "High Tide: 02:15 PM", desc: "Low Tide expected at 08:30 PM tonight.", tag: "Tide Radar" },
                { title: "Wave Height", value: "1.8 Meters", desc: "Ideal surfing conditions near the north shore break.", tag: "Surf Intel" }
            ],
            agriculture: [
                { title: "Soil Moisture", value: "34% (Optimal)", desc: "Adequate moisture levels for root growth in topsoil.", tag: "Agri Sensor" },
                { title: "Rainfall Prediction", value: "4mm expected", desc: "Light localized showers likely by late evening.", tag: "Precip Forecast" },
                { title: "Frost Alert", value: "None", desc: "No risk of sudden overnight temperature drops.", tag: "Crop Protection" }
            ],
            commuter: [
                { title: "Traffic & Weather Sync", value: "Moderate Delays", desc: "Light fog reducing visibility on highway corridor.", tag: "Route Sync" },
                { title: "Visibility Range", value: "2.5 km", desc: "Turn on low-beam headlights during transit.", tag: "Atmosphere" },
                { title: "Precipitation Alert", value: "Clear for Commute", desc: "No rain expected during standard office departure hours.", tag: "Commute Window" }
            ]
        };

        const skyThemes = {
            clear: {
                headerClass: "from-blue-600 via-sky-500 to-cyan-500",
                glowColor: "bg-cyan-400/25",
                status: "Live Sky: Clear Blue Day ☀️"
            },
            sunset: {
                headerClass: "from-amber-600 via-rose-600 to-purple-700",
                glowColor: "bg-amber-500/30",
                status: "Live Sky: Golden Hour / Sunset 🌅"
            },
            rainy: {
                headerClass: "from-slate-700 via-blue-800 to-slate-900",
                glowColor: "bg-blue-600/20",
                status: "Live Sky: Rainy & Overcast 🌧️"
            },
            stormy: {
                headerClass: "from-gray-900 via-zinc-900 to-black",
                glowColor: "bg-purple-600/20",
                status: "Live Sky: Stormy & Dark ⚡"
            },
            windy: {
                headerClass: "from-teal-600 via-cyan-700 to-blue-800",
                glowColor: "bg-teal-400/20",
                status: "Live Sky: Windy Breeze 💨"
            },
            night: {
                headerClass: "from-slate-950 via-indigo-950 to-black",
                glowColor: "bg-indigo-600/25",
                status: "Live Sky: Clear Night Sky 🌙"
            }
        };

        function updateSkyTheme() {
            const selectedTheme = document.getElementById('skyThemeSelect').value;
            const header = document.getElementById('appHeader');
            const statusText = document.getElementById('skyStatusText');
            const glow = document.getElementById('ambientGlow');
            
            const themeConfig = skyThemes[selectedTheme];
            
            header.className = `p-6 text-white bg-gradient-to-br ${themeConfig.headerClass} transition-all duration-700 relative z-10 shadow-lg`;
            glow.className = `absolute -top-24 -right-24 w-72 h-72 rounded-full ${themeConfig.glowColor} blur-3xl pointer-events-none transition-all duration-700`;
            statusText.innerText = themeConfig.status;
        }

        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('light');
            body.classList.toggle('bg-slate-950');
            body.classList.toggle('bg-slate-200');
        }

        function updateDashboard() {
            const selectedPersona = document.getElementById('personaSelect').value;
            const container = document.getElementById('widgetContainer');
            const widgets = personaData[selectedPersona];

            container.innerHTML = '';

            widgets.forEach((widget, index) => {
                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl shadow-lg transition-all duration-300 hover:scale-[1.01] animate-fade-in`;
                card.style.animationDelay = `${index * 50}ms`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1.5">
                        <h2 class="font-bold text-sm text-slate-100 light:text-slate-900 tracking-tight">${widget.title}</h2>
                        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-semibold border border-blue-500/30">${widget.tag}</span>
                    </div>
                    <p class="text-xl font-extrabold mb-1 text-white light:text-slate-950 tracking-tight">${widget.value}</p>
                    <p class="text-xs text-slate-400 light:text-slate-600 leading-relaxed">${widget.desc}</p>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            updateDashboard();
            updateSkyTheme();
        };
    </script>
</body>
</html>
